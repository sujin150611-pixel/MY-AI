<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><title>My AI 친구</title>
<style>
:root{--bg:#0b1020;--panel:#111a2e;--panel2:#17233b;--line:#263550;--text:#edf3ff;--muted:#9aabc6;--accent:#8b9cff;--accent2:#b7a1ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 50% -10%,#25335a 0%,var(--bg) 65%);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Noto Sans KR",sans-serif;height:100dvh}
.app{height:100%;max-width:1100px;margin:auto;padding:18px;display:grid;grid-template-columns:260px 1fr;gap:16px}
.sidebar,.chat{background:#10192bdc;border:1px solid var(--line);border-radius:22px;min-height:0;box-shadow:0 18px 60px #0003}
.sidebar{padding:18px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}.logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#10152a;font-size:21px}
.new{margin:24px 0 16px;border:1px solid #6576b8;background:#28365b;color:white;border-radius:13px;padding:12px;cursor:pointer;font-weight:700}.hint{font-size:12px;color:var(--muted);margin:8px 0}.history{overflow:auto;display:flex;flex-direction:column;gap:6px}.history button{border:0;background:transparent;color:#c7d2e8;text-align:left;padding:10px;border-radius:10px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.history button:hover{background:var(--panel2)}.sidefoot{margin-top:auto;color:var(--muted);font-size:12px}
.chat{display:flex;flex-direction:column;overflow:hidden}.top{padding:17px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.status{font-size:12px;color:#9ce4bd}.top small{color:var(--muted)}.messages{flex:1;overflow:auto;padding:26px clamp(14px,5vw,62px);display:flex;flex-direction:column;gap:20px}.welcome{text-align:center;margin:auto;max-width:560px}.orb{margin:0 auto 18px;width:70px;height:70px;border-radius:24px;background:linear-gradient(135deg,#8197ff,#c6a5ff);display:grid;place-items:center;color:#151a31;font-size:34px;box-shadow:0 12px 40px #8294ff44}.welcome h1{font-size:27px;margin:0 0 8px}.welcome p{color:var(--muted);margin:0 0 24px}.suggestions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.suggestions button{background:var(--panel2);border:1px solid var(--line);color:#dce6fa;padding:12px;border-radius:13px;text-align:left;cursor:pointer}.msg{display:flex;gap:11px;max-width:850px;align-self:flex-start}.msg.user{align-self:flex-end;flex-direction:row-reverse}.avatar{flex:0 0 31px;height:31px;border-radius:11px;background:#29395c;display:grid;place-items:center;font-size:15px}.user .avatar{background:#6f79cf}.bubble{padding:12px 15px;border:1px solid var(--line);background:#17233a;border-radius:4px 16px 16px 16px;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{background:#303d75;border-color:#5263a9;border-radius:16px 4px 16px 16px}.tools{display:flex;gap:6px;margin-top:7px}.tools button{border:0;background:transparent;color:var(--muted);font-size:12px;cursor:pointer}.composer-wrap{padding:14px clamp(12px,4vw,42px) 20px;border-top:1px solid var(--line)}.composer{display:flex;align-items:flex-end;gap:8px;background:#18243b;border:1px solid #344563;border-radius:17px;padding:9px}.composer textarea{flex:1;resize:none;max-height:150px;min-height:42px;border:0;outline:0;background:transparent;color:white;font:inherit;padding:9px}.iconbtn,.send{width:42px;height:42px;border:0;border-radius:12px;background:#263653;color:#dbe5ff;cursor:pointer;font-size:18px}.iconbtn.active{background:#8b394f}.send{background:linear-gradient(135deg,#8295ff,#b39aff);color:#151a31;font-weight:900}.send:disabled{opacity:.4;cursor:default}.footnote{text-align:center;color:#8090ac;font-size:11px;margin-top:9px}.typing{color:var(--muted);font-size:13px;padding:0 5px}
@media(max-width:720px){.app{display:block;padding:0;height:100dvh}.sidebar{display:none}.chat{height:100dvh;border-radius:0;border:0}.top{padding:14px 16px}.messages{padding:20px 13px}.suggestions{grid-template-columns:1fr}.welcome h1{font-size:23px}}
</style></head>
<body><div class="app">
<aside class="sidebar"><div class="brand"><div class="logo">✦</div> My AI 친구</div><button class="new" id="newChat">＋ 새 대화 시작</button><div class="hint">최근 대화</div><div class="history" id="history"></div><div class="sidefoot">대화 내용은 이 브라우저에 저장돼요.<br>AI 연결에는 API 키 설정이 필요해요.</div></aside>
<main class="chat"><header class="top"><div><b>My AI 친구</b><br><small>편하게 물어보고 이야기해 보세요</small></div><span class="status" id="status">● 준비 완료</span></header>
<section class="messages" id="messages"><div class="welcome" id="welcome"><div class="orb">✦</div><h1>안녕! 무엇이든 물어봐 😊</h1><p>공부, 아이디어, 고민 상담까지 편하게 이야기해 봐.</p><div class="suggestions"><button>오늘 하루를 기분 좋게 시작하는 방법은?</button><button>재미있는 수수께끼 하나 내줘</button><button>초등학생도 이해하기 쉽게 블랙홀 설명해 줘</button><button>나와 편하게 수다 떨자!</button></div></div></section>
<div class="composer-wrap"><div class="composer"><button class="iconbtn" id="mic" title="음성으로 입력">🎙</button><textarea id="input" rows="1" placeholder="메시지를 입력하세요… (Enter 전송 / Shift+Enter 줄바꿈)"></textarea><button class="iconbtn" id="speakToggle" title="답변 읽기 켜기/끄기">🔊</button><button class="send" id="send" disabled>➤</button></div><div class="footnote">AI 답변은 틀릴 수 있어요. 중요한 정보는 꼭 확인해 주세요.</div></div></main></div>
<script>
const $=s=>document.querySelector(s), messagesEl=$('#messages'), input=$('#input');
let chats=JSON.parse(localStorage.getItem('myai_chats')||'[]'), current=null, speaking=true, recognition=null;
function save(){localStorage.setItem('myai_chats',JSON.stringify(chats));renderHistory()}
function newChat(){current={id:Date.now(),title:'새 대화',messages:[]};chats.unshift(current);save();renderMessages()}
function renderHistory(){const el=$('#history');el.innerHTML='';chats.forEach(c=>{const b=document.createElement('button');b.textContent='▸ '+(c.title||'새 대화');b.onclick=()=>{current=c;renderMessages()};el.append(b)})}
function addMsg(role,text){current.messages.push({role,text});if(current.messages.length===1)current.title=text.slice(0,24);save();renderMessages()}
function renderMessages(){messagesEl.innerHTML='';if(!current||!current.messages.length){const w=document.createElement('div');w.className='welcome';w.innerHTML='<div class="orb">✦</div><h1>안녕! 무엇이든 물어봐 😊</h1><p>공부, 아이디어, 고민 상담까지 편하게 이야기해 봐.</p><div class="suggestions"><button>오늘 하루를 기분 좋게 시작하는 방법은?</button><button>재미있는 수수께끼 하나 내줘</button><button>초등학생도 이해하기 쉽게 블랙홀 설명해 줘</button><button>나와 편하게 수다 떨자!</button></div>';messagesEl.append(w);w.querySelectorAll('button').forEach(b=>b.onclick=()=>{input.value=b.textContent;send()});return}
current.messages.forEach(m=>{const row=document.createElement('div');row.className='msg '+m.role;const av=document.createElement('div');av.className='avatar';av.textContent=m.role==='user'?'🙂':'✦';const content=document.createElement('div');const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=m.text;content.append(bubble);if(m.role==='assistant'){const tools=document.createElement('div');tools.className='tools';const read=document.createElement('button');read.textContent='🔊 읽어주기';read.onclick=()=>speak(m.text);tools.append(read);content.append(tools)}row.append(av,content);messagesEl.append(row)});messagesEl.scrollTop=messagesEl.scrollHeight}
function speak(t){if(!('speechSynthesis'in window)){alert('이 브라우저는 음성 읽기를 지원하지 않아요.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=1;speechSynthesis.speak(u)}
async function send(){const text=input.value.trim();if(!text)return;if(!current)newChat();input.value='';resize();$('#send').disabled=true;addMsg('user',text);$('#status').textContent='● 생각 중…';const typing=document.createElement('div');typing.className='typing';typing.textContent='✦ 답변을 준비하고 있어요…';messagesEl.append(typing);messagesEl.scrollTop=messagesEl.scrollHeight;
try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:current.messages.map(m=>({role:m.role,content:m.text}))})});const data=await r.json();if(!r.ok)throw new Error(data.error||'응답을 가져오지 못했어요.');typing.remove();addMsg('assistant',data.reply);if(speaking)speak(data.reply);$('#status').textContent='● 연결됨'}
catch(e){typing.remove();addMsg('assistant','AI 서버에 연결하지 못했어요. '+e.message+'\\n\\n서버를 실행하고 OPENAI_API_KEY를 설정했는지 확인해 주세요.');$('#status').textContent='● 연결 확인 필요'}finally{$('#send').disabled=!input.value.trim()}}
function resize(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,150)+'px';$('#send').disabled=!input.value.trim()}
$('#send').onclick=send;input.addEventListener('input',resize);input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
$('#newChat').onclick=newChat;$('#speakToggle').onclick=()=>{speaking=!speaking;$('#speakToggle').classList.toggle('active',!speaking);$('#speakToggle').textContent=speaking?'🔊':'🔇'};
$('#mic').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('음성 입력은 Chrome 등 지원 브라우저에서 이용해 주세요.');return}if(recognition){recognition.stop();recognition=null;$('#mic').classList.remove('active');return}recognition=new SR();recognition.lang='ko-KR';recognition.interimResults=false;recognition.onresult=e=>{input.value+=(input.value?' ':'')+e.results[0][0].transcript;resize()};recognition.onend=()=>{$('#mic').classList.remove('active');recognition=null};recognition.onerror=()=>{$('#mic').classList.remove('active');recognition=null};recognition.start();$('#mic').classList.add('active')};
renderHistory();if(chats.length){current=chats[0];renderMessages()}else newChat();
</script></body></html>
